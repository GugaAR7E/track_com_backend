
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track | Sneakers</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .imagem-produto {
            width: 100%;
            height: 200px;
            object-fit: contain;
            display: block;
            margin-bottom: 12px;
}
        body {
            font-family: Arial, sans-serif;
            background: #080b12;
            color: white;
        }

        header {
            background: #0d1424;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #202b40;
        }
        
/* Janela de login por cima da loja */
        #conta {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.78);
            overflow-y: auto;
        }

        /* Cartão central de login e cadastro */
        #conta .conta {
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            margin: auto;
            background: #111827;
            border: 1px solid #354158;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
        }

        /* Botão para continuar sem login */
        #continuarSemLogin {
            display: block;
            width: 100%;
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid #354158;
            border-radius: 8px;
            background: transparent;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #continuarSemLogin:hover {
            background: #1f2937;
        }


        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
            color: white;
        }

        nav a {
            color: #ccc;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #5685ff;
        }

        .hero {
            padding: 80px 8%;
            background: linear-gradient(120deg, #101c35, #080b12);
        }

        .hero h1 {
            font-size: 46px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #b5bdcc;
            font-size: 18px;
        }

        section {
            padding: 45px 8%;
        }

        h2 {
            margin-bottom: 25px;
        }


.produtos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 22px;
}

/* Ajuste para celulares */
@media (max-width: 600px) {
    section {
        padding: 30px 12px;
    }

    
    /* Ajuste do cabeçalho no celular */
    header {
        padding: 16px 12px;
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
    }

    .logo {
        font-size: 25px;
        text-align: center;
    }

    header nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
    }

    header nav a {
        margin-left: 0;
        font-size: 14px;
        white-space: nowrap;
    }

    
    .produto {
        min-width: 0;
        overflow-wrap: anywhere;
    }

    .preco {
        font-size: 15px;
        text-align: center;
        overflow-wrap: anywhere;
        word-break: break-word;
        max-width: 100%;
        line-height: 1.4;
    }



    .produtos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .produto {
        min-width: 0;
        padding: 10px;
    }

    .imagem-produto {
        height: 130px;
        object-fit: contain;
    }

    .produto h3 {
        font-size: 14px;
        overflow-wrap: anywhere;
    }

    .preco {
        font-size: 16px;
    }
}


        .produto {
            background: #111827;
            padding: 25px;
            border: 1px solid #263248;
            border-radius: 10px;
        }

        .produto h3 {
            margin-bottom: 12px;
        }

        .preco {
            color: #7da0ff;
            font-size: 20px;
            margin-top: 12px;
        }

        .conta {
            max-width: 420px;
            margin: auto;
            background: #111827;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #263248;
        }

        .conta h2 {
            margin-bottom: 15px;
        }

        input {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #080b12;
            border: 1px solid #354158;
            border-radius: 5px;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            background: #315fe8;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4775ff;
        }

        #mensagem {
            margin-top: 10px;
            color: #a8bbff;
        }

        .rodape-track {
    background-color: #111;
    color: #aaa;
    text-align: center;
    padding: 25px 15px;
    margin-top: 40px;
    font-size: 13px;
        }

        .link-admin {
            display: inline-block;
            margin-top: 8px;
            color: #888;
            text-decoration: none;
            transition: color 0.3s;
        }

        .link-admin:hover {
            color: #fff;
        }

        
/* Janela Minha Conta */
#janelaMinhaConta {
    position: fixed;
    inset: 0;
    z-index: 10000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.78);
    overflow-y: auto;
}

    /* Cartão dos dados da conta */
    #janelaMinhaConta .conteudoMinhaConta {
        width: 100%;
        max-width: 400px;
        max-height: 90vh;
        overflow-y: auto;
        margin: auto;
        padding: 25px;
        background: #111827;
        color: white;
        border: 1px solid #354158;
        border-radius: 14px;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
    }

    #janelaMinhaConta h2 {
        margin-top: 0;
        margin-bottom: 25px;
    }

    #janelaMinhaConta p {
        margin: 15px 0;
        overflow-wrap: anywhere;
    }

    #janelaMinhaConta button {
        display: block;
        width: 100%;
        margin-top: 12px;
        padding: 12px;
        border: 1px solid #354158;
        border-radius: 8px;
        background: #1f2937;
        color: white;
        font-size: 15px;
        cursor: pointer;
    }

    #janelaMinhaConta #sairDaContaModal {
        background: #2563eb;
        border-color: #2563eb;
    }

    #janelaMinhaConta button:hover {
        filter: brightness(1.15);
    }

    .botao-comprar {
    margin-top: 12px;
}


#carrinhoFlutuante {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 62px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #315fe8;
    color: white;
    text-decoration: none;
    border-radius: 50%;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.35);
    z-index: 9999;

    opacity: 0;
    visibility: hidden;
    transform: translateX(100px);
    transition: opacity 0.35s ease,
                transform 0.35s ease,
                visibility 0.35s;
}

#carrinhoFlutuante.visivel {
    opacity: 1;
    visibility: visible;
    transform: translateX(0);
}

.icone-carrinho {
    font-size: 27px;
}

.contador-carrinho {
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 23px;
    height: 23px;
    padding: 0 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #0d1424;
    border-radius: 50%;
    font-size: 12px;
    font-weight: bold;
    border: 2px solid #315fe8;
}

#carrinhoFlutuante:hover {
    background: #4775ff;
}


    </style>
</head>

<body>

    <header>
        <div class="logo">TRACK</div>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#produtos">Produtos</a>
            <a href="#" id="minhaContaLink">Minha conta</a>
        </nav>
    </header>

    <main>
        <section class="hero" id="inicio">
            <h1>Encontre seu próximo passo.</h1>
            <p>Sneakers para quem tem seu próprio estilo.</p>
        </section>

        <section id="produtos">
            <h2>Nossos produtos</h2>
            <div class="produtos" id="listaProdutos">
                <p>Carregando produtos...</p>
            </div>
        </section>

        <section id="conta">
            <div class="conta">
                
                <button id="continuarSemLogin" type="button">
                    Continuar sem login
                </button>

                <h2>Crie sua conta</h2>

                <form id="formCadastro">
                    <input
                        type="text"
                        id="nome"
                        placeholder="Seu nome"
                        required
                    >

                    <input
                        type="email"
                        id="emailCadastro"
                        placeholder="Seu e-mail"
                        required
                    >

                    <input
                        type="password"
                        id="senhaCadastro"
                        placeholder="Sua senha"
                        required
                    >

                    <button type="submit">Cadastrar</button>
                </form>

                <h2>Já tem uma conta?</h2>

                <form id="formLogin">
                    <input
                        type="email"
                        id="emailLogin"
                        placeholder="Seu e-mail"
                        required
                    >

                    <input
                        type="password"
                        id="senhaLogin"
                        placeholder="Sua senha"
                        required
                    >

                    <button type="submit">Entrar</button>
                </form>

                <p id="mensagem"></p>
                <p id="usuarioLogado"></p>

                <button id="botaoSair" type="button" hidden>
                    Sair da conta
                </button>
            </div>
        </section>
        
<!-- Janela Minha Conta -->
        <div id="janelaMinhaConta" style="display: none;">
            <div class="conteudoMinhaConta">
                <h2>Minha conta</h2>

                <p><strong>Nome:</strong> <span id="nomeDaConta"></span></p>

                <p><strong>E-mail:</strong> <span id="emailDaConta"></span></p>

                <button id="sairDaContaModal" type="button">
                    Sair da conta
                </button>

                <button id="fecharMinhaConta" type="button">
                    Fechar
                </button>
            </div>
        </div>
        

    </main>

        <a href="carrinho.html" id="carrinhoFlutuante" aria-label="Abrir carrinho">
            <span class="icone-carrinho">🛒</span>
            <span class="contador-carrinho" id="contadorCarrinho">0</span>
        </a>


    <footer class="rodape-track">
        <p>&copy; 2026 Track. Todos os direitos reservados.</p>

        <a href="admin.html" class="link-admin">
            Área administrativa
        </a>
    </footer>

    <script>
        const listaProdutos = document.getElementById("listaProdutos");
        const mensagem = document.getElementById("mensagem");


        async function carregarProdutos() {
            try {
                const resposta = await fetch("/api/produtos");

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar produtos");
                }

                const produtos = await resposta.json();

                listaProdutos.innerHTML = "";

                produtos.forEach(produto => {
                    const card = document.createElement("article");
                    card.className = "produto";

                    if (produto.imagem) {
                        const imagem = document.createElement("img");
                        imagem.src = produto.imagem;
                        imagem.alt = produto.nome;
                        imagem.className = "imagem-produto";
                        imagem.loading = "lazy";

                        card.appendChild(imagem);
                    }

                    const nome = document.createElement("h3");
                    nome.textContent = produto.nome;

                    const preco = document.createElement("p");
                    preco.className = "preco";
                    preco.textContent = Number(produto.preco)
                        .toLocaleString("pt-BR", {
                            style: "currency",
                            currency: "BRL"
                        });

                    const botaoComprar = document.createElement("button");
                    botaoComprar.type = "button";
                    botaoComprar.className = "botao-comprar";
                    botaoComprar.textContent = "Comprar";

                    botaoComprar.addEventListener("click", () => {
                        const produtoSelecionado = encodeURIComponent(
                            JSON.stringify(produto)
                        );

                        window.location.href =
                            "produto.html?item=" + produtoSelecionado;
                    });

                    card.append(nome, preco, botaoComprar);
                    listaProdutos.appendChild(card);
                });

                if (produtos.length === 0) {
                    listaProdutos.textContent =
                        "Nenhum produto cadastrado.";
                }
            } catch (erro) {
                listaProdutos.textContent =
                    "Não foi possível carregar os produtos.";
                console.error(erro);
            }
        }


        document.getElementById("formCadastro")
            .addEventListener("submit", async evento => {
                evento.preventDefault();
                mensagem.textContent = "";

                const dados = {
                    nome: document.getElementById("nome").value,
                    email: document.getElementById("emailCadastro").value,
                    senha: document.getElementById("senhaCadastro").value
                };

                try {
                    const resposta = await fetch("/api/cadastro", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(dados)
                    });

                    const resultado = await resposta.json();

                    mensagem.textContent = resposta.ok
                        ? "Cadastro realizado! Agora você pode entrar."
                        : resultado.erro || "Não foi possível realizar o cadastro.";

                } catch (erro) {
                    mensagem.textContent = "Erro ao conectar ao servidor.";
                }
            });

        document.getElementById("formLogin")
            .addEventListener("submit", async evento => {
                evento.preventDefault();
                mensagem.textContent = "";

                const dados = {
                    email: document.getElementById("emailLogin").value,
                    senha: document.getElementById("senhaLogin").value
                };

                try {
                    const resposta = await fetch("/api/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(dados)
                    });

                    const resultado = await resposta.json();

                    if (resposta.ok) {
                        mensagem.textContent = "Login realizado com sucesso!";
                        verificarSessao();
                    } else {
                        mensagem.textContent =
                            resultado.erro || "E-mail ou senha incorretos.";
                    }
                } catch (erro) {
                    mensagem.textContent = "Erro ao conectar ao servidor.";
                }
            });

        async function verificarSessao() {
            try {
                const resposta = await fetch("/api/sessao");
                const dados = await resposta.json();

                document.getElementById("usuarioLogado").textContent =
                    dados.usuario
                        ? "Logado como: " + dados.usuario.nome
                        : "";

                document.getElementById("botaoSair").hidden =
                    !dados.usuario;

                document.getElementById("conta").style.display =
                    dados.usuario ? "none" : "flex";
            } catch (erro) {
                console.error("Não foi possível verificar a sessão.", erro);
            }
        }

        document.getElementById("botaoSair")
            .addEventListener("click", async () => {
                try {
                    const resposta = await fetch("/api/logout", {
                        method: "POST"
                    });

                    if (resposta.ok) {
                        mensagem.textContent = "Você saiu da sua conta.";
                        verificarSessao();
                    }
                } catch (erro) {
                    mensagem.textContent = "Erro ao sair da conta.";
                }
            });

        carregarProdutos();
        verificarSessao();

        
        document.getElementById("continuarSemLogin")
            .addEventListener("click", () => {
                document.getElementById("conta").style.display = "none";
            });

            
        document.getElementById("minhaContaLink")
            .addEventListener("click", async (evento) => {
                evento.preventDefault();

        try {
            const resposta = await fetch("/api/sessao");
            const dados = await resposta.json();

            if (dados.usuario) {
                document.getElementById("nomeDaConta").textContent =
                    dados.usuario.nome;

                document.getElementById("emailDaConta").textContent =
                    dados.usuario.email;

                document.getElementById("janelaMinhaConta").style.display =
                    "flex";
            } else {
                document.getElementById("conta").style.display = "flex";
            }
        } catch (erro) {
            console.error("Erro ao consultar a conta:", erro);
        }
    });

// Fechar a janela Minha Conta
        document.getElementById("fecharMinhaConta")
            .addEventListener("click", () => {
                document.getElementById("janelaMinhaConta").style.display = "none";
            });

        // Sair da conta pela janela Minha Conta
        document.getElementById("sairDaContaModal")
            .addEventListener("click", () => {
                document.getElementById("janelaMinhaConta").style.display = "none";
                document.getElementById("botaoSair").click();
            });

            
            function atualizarCarrinhoFlutuante() {
                let carrinho = [];

                try {
                    carrinho = JSON.parse(
                        localStorage.getItem("trackCarrinho") || "[]"
                    );

                    if (!Array.isArray(carrinho)) carrinho = [];
                } catch (erro) {
                    carrinho = [];
                }

                const total = carrinho.reduce(
                    (soma, item) => soma + (Number(item.quantidade) || 1),
                    0
                );

                document.getElementById("contadorCarrinho").textContent = total;

                const botao = document.getElementById("carrinhoFlutuante");
                botao.classList.toggle("visivel", total > 0);
            }

            atualizarCarrinhoFlutuante();

            window.addEventListener("pageshow", atualizarCarrinhoFlutuante);


    </script>


</body>
</html>
